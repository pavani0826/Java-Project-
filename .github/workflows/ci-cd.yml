name: Java CI/CD

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/pavani0826/java-project

jobs:

  test_java:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Test
        run: |
          echo "Testing..."
          mvn test


  build_java:
    needs: test_java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .


  push_java:
    needs: build_java
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest


  deploy_java:
    needs: push_java
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "Deploying..."
          echo "Docker image: $IMAGE_NAME:latest"
