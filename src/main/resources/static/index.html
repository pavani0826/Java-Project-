<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Todo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="hero">
        <div class="spider">🕷️</div>
        <h1>SPIDER-MAN</h1>
        <p>With great power comes great productivity.</p>
    </div>

    <div class="todo-box">

        <div class="input-area">
            <input
                type="text"
                id="todoInput"
                placeholder="What needs to be done?"
            >
            <button onclick="addTodo()">ADD</button>
        </div>

        <ul id="todoList"></ul>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
